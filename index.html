<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Leveler News: Campaign Finance Tracker</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f3f4f6; color: #111827; display: flex; height: 100vh; overflow: hidden; }

  /* ── Sidebar ── */
  #sidebar { width: 220px; min-width: 220px; background: #fff; border-right: 1px solid #e5e7eb; display: flex; flex-direction: column; padding: 24px 0 0; transition: transform .25s; overflow-y: auto; }
  .sidebar-header { padding: 0 20px 24px; border-bottom: 1px solid #e5e7eb; }
  .sidebar-cycle { font-size: 11px; color: #9ca3af; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 6px; }
  .sidebar-title { font-size: 17px; font-weight: 700; line-height: 1.3; color: #111827; }
  nav { padding: 16px 0; }
  nav a { display: flex; align-items: center; gap: 10px; padding: 10px 20px; font-size: 14px; color: #6b7280; text-decoration: none; cursor: pointer; transition: background .15s; }
  nav a:hover { background: #f3f4f6; color: #111827; }
  nav a.active { background: #eff6ff; color: #1d4ed8; border-left: 3px solid #2563eb; }
  nav a .icon { width: 16px; text-align: center; }
  .nav-back { padding: 10px 20px 0; }
  .nav-back button { background: none; border: none; color: #9ca3af; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 6px; padding: 0; }
  .nav-back button:hover { color: #111827; }
  .nav-section { padding: 8px 20px 4px; font-size: 10px; color: #9ca3af; text-transform: uppercase; letter-spacing: .1em; }

  /* ── Overlay (mobile) ── */
  #overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.3); z-index: 10; }
  #overlay.open { display: block; }

  /* ── Top bar (mobile only) ── */
  #topbar { display: none; align-items: center; gap: 12px; padding: 12px 16px; background: #fff; border-bottom: 1px solid #e5e7eb; flex-shrink: 0; }
  #menu-btn { background: none; border: none; color: #374151; font-size: 20px; cursor: pointer; line-height: 1; padding: 2px 4px; }
  #topbar-title { font-size: 15px; font-weight: 700; color: #111827; }

  /* ── Main ── */
  #main { flex: 1; overflow-y: auto; padding: 32px 36px; }
  .page { display: none; }
  .page.active { display: block; }

  /* ── Summary ── */
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 32px; }
  .stat-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 18px 20px; }
  .stat-label { font-size: 11px; color: #9ca3af; text-transform: uppercase; letter-spacing: .07em; margin-bottom: 8px; }
  .stat-value { font-size: 26px; font-weight: 700; color: #111827; }
  .stat-sub { font-size: 12px; color: #9ca3af; margin-top: 4px; }

  .race-section { margin-bottom: 28px; }
  .race-badge { display: inline-block; background: #dbeafe; color: #1d4ed8; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 4px; margin-bottom: 10px; }
  .candidate-table { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; overflow: hidden; margin-bottom: 8px; }
  .table-header { display: grid; grid-template-columns: 1fr 160px 160px; padding: 10px 16px; font-size: 11px; color: #9ca3af; text-transform: uppercase; letter-spacing: .07em; border-bottom: 1px solid #e5e7eb; }
  .candidate-row { display: grid; grid-template-columns: 1fr 160px 160px; padding: 14px 16px; align-items: center; border-bottom: 1px solid #e5e7eb; cursor: pointer; transition: background .15s; }
  .candidate-row:last-child { border-bottom: none; }
  .candidate-row:hover { background: #f9fafb; }
  .subtotal-row { display: grid; grid-template-columns: 1fr 160px 160px; padding: 10px 16px; font-size: 13px; color: #9ca3af; border-top: 1px solid #e5e7eb; background: #f9fafb; }
  .cand-info { display: flex; align-items: center; gap: 10px; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }
  .cand-name { font-size: 14px; font-weight: 500; color: #111827; }
  .raised-col { font-size: 14px; font-weight: 600; color: #111827; }
  .share-col { display: flex; align-items: center; gap: 8px; }
  .share-bar-bg { flex: 1; height: 6px; background: #e5e7eb; border-radius: 3px; overflow: hidden; }
  .share-bar { height: 100%; border-radius: 3px; }
  .share-pct { font-size: 12px; color: #9ca3af; width: 36px; text-align: right; }

  /* ── Detail panels ── */
  .detail-panel { display: none; }
  .detail-panel.active { display: block; }

  .data-table { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; overflow: hidden; }
  .data-table-header { display: grid; padding: 10px 16px; font-size: 11px; color: #9ca3af; text-transform: uppercase; letter-spacing: .07em; border-bottom: 1px solid #e5e7eb; }
  .data-row { display: grid; padding: 12px 16px; font-size: 13px; border-bottom: 1px solid #e5e7eb; align-items: center; color: #111827; }
  .data-row:last-child { border-bottom: none; }
  .data-row:hover { background: #f9fafb; }
  .cols-2 { grid-template-columns: 1fr 120px; }
  .cols-3 { grid-template-columns: 1fr 1fr 120px; }
  .amount { font-size: 14px; font-weight: 600; color: #2563eb; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; background: #dbeafe; color: #1d4ed8; }

  .type-bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; font-size: 13px; color: #374151; }
  .type-bar-label { width: 220px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .type-bar-bg { flex: 1; height: 8px; background: #e5e7eb; border-radius: 4px; overflow: hidden; }
  .type-bar-fill { height: 100%; border-radius: 4px; background: #2563eb; }
  .type-bar-pct { font-size: 12px; color: #9ca3af; width: 40px; text-align: right; }
  .type-bar-amt { font-size: 13px; font-weight: 600; width: 100px; text-align: right; color: #111827; }

  .type-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
  .type-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 18px 20px; }
  .type-card-label { font-size: 11px; color: #9ca3af; text-transform: uppercase; letter-spacing: .07em; margin-bottom: 6px; }
  .type-card-value { font-size: 20px; font-weight: 700; color: #2563eb; }
  .type-card-sub { font-size: 12px; color: #9ca3af; margin-top: 4px; }

  h2 { font-size: 22px; font-weight: 700; margin-bottom: 4px; color: #111827; }
  .page-sub { font-size: 13px; color: #9ca3af; margin-bottom: 24px; }
  .empty { color: #9ca3af; font-size: 13px; padding: 24px 16px; }

  .color-0 { background: #3b82f6; } .color-1 { background: #f59e0b; } .color-2 { background: #10b981; }
  .color-3 { background: #ef4444; } .color-4 { background: #8b5cf6; } .color-5 { background: #ec4899; }

  /* ── Mobile ── */
  @media (max-width: 640px) {
    body { flex-direction: column; height: 100dvh; overflow: hidden; }

    #sidebar {
      position: fixed; top: 0; left: 0; height: 100%; z-index: 20;
      transform: translateX(-100%);
      width: 260px; min-width: unset;
    }
    #sidebar.open { transform: translateX(0); }

    #topbar { display: flex; }

    #main { padding: 16px; overflow-y: auto; }

    .stat-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 20px; }
    .stat-card { padding: 12px 10px; }
    .stat-value { font-size: 18px; }
    .stat-label { font-size: 10px; }

    .table-header { grid-template-columns: 1fr 90px; }
    .table-header span:nth-child(3) { display: none; }
    .candidate-row { grid-template-columns: 1fr 90px; }
    .candidate-row .share-col { display: none; }
    .subtotal-row { grid-template-columns: 1fr 90px; }
    .subtotal-row span:nth-child(3) { display: none; }

    .type-grid { grid-template-columns: 1fr 1fr; }
    .type-bar-label { width: 120px; font-size: 12px; }
    .type-bar-amt { width: 70px; font-size: 12px; }

    .cols-3 { grid-template-columns: 1fr 100px; }
    .data-table-header.cols-3 span:nth-child(2),
    .data-row.cols-3 > div:nth-child(2) { display: none; }
  }
  /* ── Geography panel ── */
  .geo-section { margin-bottom: 28px; }
  .geo-section-title { font-size: 15px; font-weight: 600; color: #374151; margin-bottom: 14px; }

  /* In/out-of-state slider */
  .instate-bar-wrap { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 20px; }
  .instate-bar-track { display: flex; height: 28px; border-radius: 6px; overflow: hidden; margin-bottom: 12px; }
  .instate-bar-seg { display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #fff; transition: width .4s; overflow: hidden; white-space: nowrap; }
  .instate-legend { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
  .instate-legend-item { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #374151; }
  .instate-legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .instate-legend-val { font-weight: 600; }

  /* Map */
  .geo-map-wrap { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 20px; }
  .geo-map-legend { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  .geo-map-legend-item { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #374151; }
  .geo-map-legend-swatch { width: 16px; height: 16px; border-radius: 2px; flex-shrink: 0; }
  #geo-svg { width: 100%; height: auto; display: block; }
  #geo-svg path { stroke: #fff; stroke-width: 0.5; }
  #geo-svg path:hover { opacity: .8; cursor: default; }
  .geo-tooltip { position: fixed; background: #111827; color: #fff; font-size: 13px; padding: 6px 10px; border-radius: 6px; pointer-events: none; white-space: nowrap; z-index: 100; display: none; }

  @media (max-width: 640px) {
    .instate-legend { gap: 12px; }
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
</head>
<body>

<!-- Mobile top bar -->
<div id="topbar">
  <button id="menu-btn" aria-label="Open menu">☰</button>
  <div id="topbar-title">Campaign Finance Tracker</div>
</div>

<!-- Overlay -->
<div id="overlay"></div>

<!-- Sidebar / Drawer -->
<div id="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-cycle">Created by Branch Four Inc.</div>
    <div class="sidebar-title">Campaign<br>Finance Tracker</div>
  </div>
  <div id="sidebar-summary-nav">
    <nav>
      <a class="active" data-page="summary"><span class="icon">▦</span> Summary</a>
    </nav>
  </div>
  <div id="sidebar-detail-nav" style="display:none">
    <div class="nav-back">
      <button id="back-btn">← All Elections</button>
    </div>
    <div class="nav-section" id="detail-nav-candidate"></div>
    <nav>
      <a class="active" data-tab="contrib-types"><span class="icon">◑</span> Contribution Types</a>
      <a data-tab="pac"><span class="icon">★</span> PAC Contributors</a>
      <a data-tab="corporate"><span class="icon">⬡</span> Corporate</a>
      <a data-tab="top"><span class="icon">▲</span> Top Contributors</a>
      <a data-tab="geography"><span class="icon">⊕</span> Geography</a>
    </nav>
  </div>
  <div id="sidebar-source" style="padding: 16px 20px; margin-top: auto; font-size: 11px; color: #9ca3af; border-top: 1px solid #e5e7eb; display: none;"></div>
</div>

<div id="main">
  <div id="summary" class="page active"></div>
  <div id="candidate-detail" class="page"></div>
</div>

<div id="geo-tooltip" class="geo-tooltip"></div>

<script>
const COLORS = ['#3b82f6','#f59e0b','#10b981','#ef4444','#8b5cf6','#ec4899'];

function fmt(n) { return '$' + Number(n).toLocaleString(undefined, {minimumFractionDigits:0, maximumFractionDigits:0}); }
function initials(name) { return name.split(' ').filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join(''); }

function parseCSV(text) {
  const lines = text.trim().split('\n');
  const keys = lines[0].split(',').map(k => k.replace(/^"|"$/g,'').trim());
  return lines.slice(1).map(line => {
    const vals = [];
    let cur = '', inQ = false;
    for (const ch of line) {
      if (ch === '"') { inQ = !inQ; }
      else if (ch === ',' && !inQ) { vals.push(cur.trim()); cur = ''; }
      else cur += ch;
    }
    vals.push(cur.trim());
    return Object.fromEntries(keys.map((k,i) => [k, vals[i] ?? '']));
  });
}

// ── Drawer ──
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('overlay');

function openDrawer() { sidebar.classList.add('open'); overlay.classList.add('open'); }
function closeDrawer() { sidebar.classList.remove('open'); overlay.classList.remove('open'); }

document.getElementById('menu-btn').addEventListener('click', openDrawer);
overlay.addEventListener('click', closeDrawer);



// close drawer on nav item click (mobile)
sidebar.addEventListener('click', e => {
  if (e.target.closest('nav a') || e.target.closest('#back-btn')) closeDrawer();
});

// ── Data ──
let DATA = {};

async function loadAll() {
  const files = ['total_contributions','contributor_types','pac_contributors','corporate_contributors','top_contributors','instate_perc','all_state_perc'];
  const [paramsText, ...results] = await Promise.all([
    fetch('data_output/parameters.csv').then(r => r.text()),
    ...files.map(f => fetch(`data_output/${f}.csv`).then(r => r.text()))
  ]);
  files.forEach((f, i) => DATA[f] = parseCSV(results[i]));

  const params = parseCSV(paramsText)[0];
  DATA.params = params;

  document.title = `${params['Newsroom']}: Campaign Finance Tracker`;
  const sourceEl = document.getElementById('sidebar-source');
  sourceEl.textContent = `Data sourced from ${params['State']} State Board of Elections.`;
  sourceEl.style.display = 'block';

  renderSummary();
}

function renderSummary() {
  const totals = DATA.total_contributions;
  const grandTotal = totals.reduce((s,r) => s + +r['Total Contributions'], 0);

  const byRace = {};
  totals.forEach(r => {
    const key = `${r.Office} – ${r.Location}`;
    (byRace[key] = byRace[key] || []).push(r);
  });

  let racesHTML = '';
  Object.entries(byRace).forEach(([race, candidates], ri) => {
    const sorted = [...candidates].sort((a,b) => +b['Total Contributions'] - +a['Total Contributions']);
    const raceTotal = sorted.reduce((s,r) => s + +r['Total Contributions'], 0);

    const rows = sorted.map((c, ci) => {
      const pct = raceTotal ? Math.round(+c['Total Contributions'] / raceTotal * 100) : 0;
      const color = COLORS[(ri * 3 + ci) % COLORS.length];
      return `<div class="candidate-row" data-id="${c.CandidateID}" data-name="${c.Candidate}">
        <div class="cand-info">
          <div class="avatar" style="background:${color}22;color:${color}">${initials(c.Candidate)}</div>
          <div class="cand-name">${c.Candidate}</div>
        </div>
        <div class="raised-col">${fmt(c['Total Contributions'])}</div>
        <div class="share-col">
          <div class="share-bar-bg"><div class="share-bar" style="width:${pct}%;background:${color}"></div></div>
          <span class="share-pct">${pct}%</span>
        </div>
      </div>`;
    }).join('');

    racesHTML += `<div class="race-section">
      <div class="race-badge">${race}</div>
      <div class="candidate-table">
        <div class="table-header"><span>Candidate</span><span>Total Raised</span><span>Share of Election</span></div>
        ${rows}
        <div class="subtotal-row"><span>Election Total</span><span>${fmt(raceTotal)}</span><span></span></div>
      </div>
    </div>`;
  });

  const numRaces = Object.keys(byRace).length;
  document.getElementById('summary').innerHTML = `
    <h2>Summary</h2>
    <div class="page-sub">Data Updated: ${DATA.params['Data End']}</div>
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Total Raised</div><div class="stat-value">${fmt(grandTotal)}</div><div class="stat-sub">All candidates</div></div>
      <div class="stat-card"><div class="stat-label">Candidates</div><div class="stat-value">${totals.length}</div></div>
      <div class="stat-card"><div class="stat-label">Elections</div><div class="stat-value">${numRaces}</div></div>
    </div>
    ${racesHTML}`;

  document.querySelectorAll('.candidate-row').forEach(row => {
    row.addEventListener('click', () => showCandidate(row.dataset.id, row.dataset.name));
  });
}

function showCandidate(id, name) {
  document.getElementById('sidebar-summary-nav').style.display = 'none';
  document.getElementById('sidebar-detail-nav').style.display = 'block';
  document.getElementById('detail-nav-candidate').textContent = name;
  document.getElementById('topbar-title').textContent = name;

  document.getElementById('summary').classList.remove('active');
  document.getElementById('candidate-detail').classList.add('active');

  renderCandidateDetail(id, name);
  document.querySelectorAll('#sidebar-detail-nav nav a').forEach((a,i) => a.classList.toggle('active', i===0));
  showDetailPanel('contrib-types');
}

document.getElementById('back-btn').addEventListener('click', () => {
  document.getElementById('sidebar-summary-nav').style.display = 'block';
  document.getElementById('sidebar-detail-nav').style.display = 'none';
  document.getElementById('topbar-title').textContent = 'Campaign Finance Tracker';
  document.getElementById('candidate-detail').classList.remove('active');
  document.getElementById('summary').classList.add('active');
});

document.querySelectorAll('#sidebar-detail-nav nav a').forEach(a => {
  a.addEventListener('click', () => {
    document.querySelectorAll('#sidebar-detail-nav nav a').forEach(x => x.classList.remove('active'));
    a.classList.add('active');
    showDetailPanel(a.dataset.tab);
  });
});

function showDetailPanel(tab) {
  document.querySelectorAll('.detail-panel').forEach(p => p.classList.remove('active'));
  const el = document.getElementById(`panel-${tab}`);
  if (el) el.classList.add('active');
}

function renderCandidateDetail(id, name) {
  const types = DATA.contributor_types.filter(r => r.CandidateID === id);
  const pacs = DATA.pac_contributors.filter(r => r.CandidateID === id);
  const corps = DATA.corporate_contributors.filter(r => r.CandidateID === id);
  const tops = DATA.top_contributors.filter(r => r.CandidateID === id);

  document.getElementById('candidate-detail').innerHTML = `
    <h2>${name}</h2>
    <div class="page-sub">Campaign finance detail</div>
    <div id="panel-contrib-types" class="detail-panel active">${renderContribTypes(types)}</div>
    <div id="panel-pac" class="detail-panel">${renderSimpleTable(pacs, ['Contributor Name','Total Contributions'])}</div>
    <div id="panel-corporate" class="detail-panel">${renderSimpleTable(corps, ['Contributor Name','Total Contributions'])}</div>
    <div id="panel-top" class="detail-panel">${renderTopContribs(tops)}</div>
    <div id="panel-geography" class="detail-panel"></div>`;

  renderGeography(id, name);
}

function renderContribTypes(types) {
  if (!types.length) return '<div class="empty">No data available.</div>';
  const total = types.reduce((s,r) => s + +r['Total Contributions'], 0);
  const sorted = [...types].sort((a,b) => +b['Total Contributions'] - +a['Total Contributions']);

  const cards = sorted.slice(0,3).map(r => `
    <div class="type-card">
      <div class="type-card-label">${r['Contributor Type']}</div>
      <div class="type-card-value" style="color:#2563eb">${fmt(r['Total Contributions'])}</div>
      <div class="type-card-sub">${r['Number of Contributions']} contributions</div>
    </div>`).join('');

  const bars = sorted.map(r => {
    const pct = total ? Math.round(+r['Total Contributions'] / total * 100) : 0;
    return `<div class="type-bar-row">
      <div class="type-bar-label">${r['Contributor Type']}</div>
      <div class="type-bar-bg"><div class="type-bar-fill" style="width:${pct}%"></div></div>
      <div class="type-bar-pct">${pct}%</div>
      <div class="type-bar-amt">${fmt(r['Total Contributions'])}</div>
    </div>`;
  }).join('');

  return `<div class="type-grid">${cards}</div>
    <div class="candidate-table" style="padding:20px">${bars}</div>`;
}

function renderSimpleTable(rows, cols) {
  if (!rows.length) return '<div class="empty">No data available.</div>';
  const sorted = [...rows].sort((a,b) => +b[cols[1]] - +a[cols[1]]);
  const tableRows = sorted.map(r => `
    <div class="data-row cols-2">
      <div>${r[cols[0]]}</div>
      <div class="amount">${fmt(r[cols[1]])}</div>
    </div>`).join('');
  return `<div class="data-table">
    <div class="data-table-header cols-2"><span>${cols[0]}</span><span>Amount</span></div>
    ${tableRows}
  </div>`;
}

function renderTopContribs(rows) {
  if (!rows.length) return '<div class="empty">No data available.</div>';
  const sorted = [...rows].sort((a,b) => +b['Total Contributions'] - +a['Total Contributions']);
  const tableRows = sorted.map(r => `
    <div class="data-row cols-3">
      <div>${r['Contributor Name']}</div>
      <div><span class="badge">${r['Contributor Type']}</span></div>
      <div class="amount">${fmt(r['Total Contributions'])}</div>
    </div>`).join('');
  return `<div class="data-table">
    <div class="data-table-header cols-3"><span>Name</span><span>Type</span><span>Amount</span></div>
    ${tableRows}
  </div>`;
}

// ── State abbreviation → FIPS lookup ──
const ABBR_TO_FIPS = {
  AL:'01',AK:'02',AZ:'04',AR:'05',CA:'06',CO:'08',CT:'09',DE:'10',DC:'11',FL:'12',
  GA:'13',HI:'15',ID:'16',IL:'17',IN:'18',IA:'19',KS:'20',KY:'21',LA:'22',ME:'23',
  MD:'24',MA:'25',MI:'26',MN:'27',MS:'28',MO:'29',MT:'30',NE:'31',NV:'32',NH:'33',
  NJ:'34',NM:'35',NY:'36',NC:'37',ND:'38',OH:'39',OK:'40',OR:'41',PA:'42',RI:'44',
  SC:'45',SD:'46',TN:'47',TX:'48',UT:'49',VT:'50',VA:'51',WA:'53',WV:'54',WI:'55',
  WY:'56',PR:'72'
};

// Cache TopoJSON so we only fetch it once
let _usTopoCache = null;
async function getUSTopo() {
  if (!_usTopoCache) {
    _usTopoCache = await fetch('https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json').then(r => r.json());
  }
  return _usTopoCache;
}

async function renderGeography(id, name) {
  const panel = document.getElementById('panel-geography');
  panel.innerHTML = '<div class="empty" style="padding:24px 0">Loading map…</div>';

  // ── In/out-of-state slider ──
  const instateRows = DATA.instate_perc.filter(r => r.CandidateID === id);
  const byLoc = {};
  instateRows.forEach(r => { byLoc[r['Contributor Location']] = +r.Amount || 0; });
  const inAmt  = byLoc['In-state']    || 0;
  const outAmt = byLoc['Out-of-state'] || 0;
  const undAmt = byLoc['Undisclosed']  || 0;
  const locTotal = inAmt + outAmt + undAmt;

  const pctIn  = locTotal ? (inAmt  / locTotal * 100) : 0;
  const pctOut = locTotal ? (outAmt / locTotal * 100) : 0;
  const pctUnd = locTotal ? (undAmt / locTotal * 100) : 0;

  const segStyle = (pct, color) =>
    pct >= 5
      ? `style="width:${pct.toFixed(1)}%;background:${color}"`
      : `style="width:${pct.toFixed(1)}%;background:${color};font-size:0"`;

  const sliderHTML = locTotal === 0
    ? '<div class="empty">No location data available.</div>'
    : `<div class="instate-bar-wrap">
        <div class="instate-bar-track">
          <div class="instate-bar-seg" ${segStyle(pctIn,  '#2563eb')}>${pctIn.toFixed(0)}%</div>
          <div class="instate-bar-seg" ${segStyle(pctOut, '#10b981')}>${pctOut.toFixed(0)}%</div>
          <div class="instate-bar-seg" ${segStyle(pctUnd, '#d1d5db')}>${pctUnd.toFixed(0)}%</div>
        </div>
        <div class="instate-legend">
          <div class="instate-legend-item">
            <div class="instate-legend-dot" style="background:#2563eb"></div>
            In-state &nbsp;<span class="instate-legend-val">${fmt(inAmt)}</span>&nbsp;(${pctIn.toFixed(1)}%)
          </div>
          <div class="instate-legend-item">
            <div class="instate-legend-dot" style="background:#10b981"></div>
            Out-of-state &nbsp;<span class="instate-legend-val">${fmt(outAmt)}</span>&nbsp;(${pctOut.toFixed(1)}%)
          </div>
          ${undAmt > 0 ? `<div class="instate-legend-item">
            <div class="instate-legend-dot" style="background:#d1d5db"></div>
            Undisclosed &nbsp;<span class="instate-legend-val">${fmt(undAmt)}</span>&nbsp;(${pctUnd.toFixed(1)}%)
          </div>` : ''}
        </div>
      </div>`;

  // ── Choropleth map ──
  const stateRows = DATA.all_state_perc.filter(r => r.CandidateID === id);
  const byState = {};
  stateRows.forEach(r => { byState[r.State] = +r.Amount || 0; });

  const amounts = Object.values(byState).filter(v => v > 0);
  const maxAmt  = amounts.length ? Math.max(...amounts) : 1;

  // 5-step threshold based on max value
  const step = maxAmt / 5;
  const thresholds = [step, step*2, step*3, step*4];
  const GREEN = ['#e8f5e9','#a5d6a7','#66bb6a','#43a047','#2e7d32'];
  const GRAY  = '#f3f4f6';

  const colorScale = (v) => {
    if (!v) return GRAY;
    for (let i = 0; i < thresholds.length; i++) {
      if (v <= thresholds[i]) return GREEN[i];
    }
    return GREEN[4];
  };

  const legendHTML = GREEN.map((c, i) => `
    <div class="geo-map-legend-item">
      <div class="geo-map-legend-swatch" style="background:${c}"></div>
      ${i === GREEN.length - 1
        ? `&ge; ${fmt(thresholds[i-1])}`
        : `${fmt(i === 0 ? 0 : thresholds[i-1])} – ${fmt(thresholds[i])}`}
    </div>`).join('');

  panel.innerHTML = `
    <div class="geo-section">
      <div class="geo-section-title">In-state vs. Out-of-state</div>
      ${sliderHTML}
    </div>
    <div class="geo-section">
      <div class="geo-section-title">Contributions by State</div>
      <div class="geo-map-wrap">
        <div class="geo-map-legend">${legendHTML}</div>
        <svg id="geo-svg" viewBox="0 0 960 600"></svg>
      </div>
    </div>`;

  // Draw map with D3
  try {
    const us = await getUSTopo();
    const states = topojson.feature(us, us.objects.states);

    // Build fips→amount map
    const amtByFips = {};
    Object.entries(byState).forEach(([abbr, amt]) => {
      const fips = ABBR_TO_FIPS[abbr];
      if (fips) amtByFips[fips] = amt;
    });

    // Reverse lookup FIPS→abbreviation for tooltip
    const fipsToAbbr = {};
    Object.entries(ABBR_TO_FIPS).forEach(([a, f]) => fipsToAbbr[f] = a);

    // Use albersUsa — matches the us-atlas coordinate space exactly
    const W = 960, H = 600;
    const projection = d3.geoAlbersUsa().scale(1300).translate([W/2, H/2]);
    const path = d3.geoPath().projection(projection);
    const tip  = document.getElementById('geo-tooltip');

    const svg = d3.select('#geo-svg')
      .attr('viewBox', `0 0 ${W} ${H}`)
      .attr('width', '100%')
      .attr('height', 'auto');

    svg.selectAll('path')
      .data(states.features)
      .join('path')
      .attr('d', path)
      .attr('fill', d => {
        const fips = String(d.id).padStart(2,'0');
        return colorScale(amtByFips[fips] || 0);
      })
      .on('mousemove', function(event, d) {
        const fips = String(d.id).padStart(2,'0');
        const abbr = fipsToAbbr[fips] || '';
        const amt  = amtByFips[fips]  || 0;
        tip.style.display = 'block';
        tip.style.left    = (event.clientX + 12) + 'px';
        tip.style.top     = (event.clientY - 28) + 'px';
        tip.textContent   = amt ? `${abbr}: ${fmt(amt)}` : `${abbr}: $0`;
      })
      .on('mouseleave', () => { tip.style.display = 'none'; });

    // State abbreviation labels — only render if centroid is within the projection
    svg.selectAll('text')
      .data(states.features)
      .join('text')
      .each(function(d) {
        const c = projection(d3.geoCentroid(d));
        if (!c) { d3.select(this).remove(); return; }
        d3.select(this)
          .attr('x', c[0])
          .attr('y', c[1])
          .attr('text-anchor', 'middle')
          .attr('dominant-baseline', 'central')
          .attr('font-size', '8')
          .attr('font-family', '-apple-system, BlinkMacSystemFont, sans-serif')
          .attr('fill', '#374151')
          .attr('pointer-events', 'none')
          .text(fipsToAbbr[String(d.id).padStart(2,'0')] || '');
      });
  } catch(e) {
    document.querySelector('#panel-geography .geo-map-wrap').insertAdjacentHTML(
      'beforeend', '<div class="empty" style="margin-top:8px">Map unavailable (network error).</div>'
    );
  }
}

loadAll();
</script>
